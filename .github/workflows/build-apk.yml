name: Build Cashbook APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Arrange files into the right folders
        run: |
          mkdir -p www www/icons resources
          for f in index.html sw.js manifest.webmanifest; do
            [ -f "$f" ] && mv -f "$f" www/ || true
          done
          [ -f icon.png ] && mv -f icon.png resources/ || true
          [ -f icon-1024.png ] && cp -f icon-1024.png resources/icon.png || true
          for f in icon-192.png icon-512.png maskable-512.png apple-touch-icon.png favicon.png; do
            [ -f "$f" ] && mv -f "$f" www/icons/ || true
          done
          echo "=== Arranged file tree ==="
          ls -R www resources || true
          test -f www/index.html || { echo "ERROR: www/index.html missing — did index.html get uploaded?"; exit 1; }
          test -f resources/icon.png || echo "WARNING: no app icon found, will use default"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Use a stable signing key (fixes "conflicting signature" on updates)
        run: |
          mkdir -p ~/.android
          if [ -f cashbook-debug.keystore ]; then
            cp cashbook-debug.keystore ~/.android/debug.keystore
            echo "Stable keystore installed."
          else
            echo "WARNING: cashbook-debug.keystore not found in repo root — builds will not be updatable."
          fi
          # give each build a higher version code (needed for clean updates & Play)
          BG=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$BG" || true
          echo "versionCode set to ${{ github.run_number }}"

      - name: Generate app icon (best effort)
        run: |
          npm install -D @capacitor/assets 2>/dev/null && npx capacitor-assets generate --android || echo "icon generation skipped, using default Capacitor icon"

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Cashbook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
