name: Build Cashbook APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Arrange files into the right folders
        run: |
          mkdir -p www www/icons www/fonts resources
          for f in index.html styles.css app.js sw.js manifest.webmanifest; do
            [ -f "$f" ] && mv -f "$f" www/ || true
          done
          for f in *.woff2; do
            [ -f "$f" ] && mv -f "$f" www/fonts/ || true
          done
          [ -f icon.png ] && mv -f icon.png resources/ || true
          [ -f icon-1024.png ] && cp -f icon-1024.png resources/icon.png || true
          for f in icon-192.png icon-512.png maskable-512.png apple-touch-icon.png favicon.png; do
            [ -f "$f" ] && mv -f "$f" www/icons/ || true
          done
          echo "=== Arranged file tree ==="
          ls -R www resources || true
          test -f www/index.html || { echo "ERROR: www/index.html missing — did index.html get uploaded?"; exit 1; }
          test -f resources/icon.png || echo "WARNING: no app icon found, will use default"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Use a stable signing key (fixes "conflicting signature" on updates)
        run: |
          mkdir -p ~/.android
          if [ -f cashbook-debug.keystore ]; then
            cp cashbook-debug.keystore ~/.android/debug.keystore
            echo "Stable keystore installed."
          else
            echo "WARNING: cashbook-debug.keystore not found in repo root — builds will not be updatable."
          fi
          # give each build a higher version code (needed for clean updates & Play)
          BG=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$BG" || true
          echo "versionCode set to ${{ github.run_number }}"

      - name: Generate app icon (best effort)
        run: |
          npm install -D @capacitor/assets 2>/dev/null && npx capacitor-assets generate --android || echo "icon generation skipped, using default Capacitor icon"

      - name: Sync web app into Android project
        run: npx cap sync android

      # The soft keyboard must OVERLAY the app, never resize it. Android resizing the
      # WebView frame-by-frame as the keyboard slides in is what made the entry form
      # flicker. capacitor.config.json's Keyboard resize:"none" is not enough on its
      # own — the window mode in the generated AndroidManifest wins over it, so force
      # adjustNothing here. AndroidManifest.xml is generated by `cap add android`, so
      # this patch has to live in CI rather than in the repo.
      - name: Keyboard must overlay, not resize the WebView
        run: |
          cat > patch-manifest.js <<'NODEEOF'
          var fs = require('fs');
          var p = 'android/app/src/main/AndroidManifest.xml';
          var s = fs.readFileSync(p, 'utf8');
          var found = false;
          s = s.replace(/<activity([^>]*MainActivity[^>]*)>/, function (m, attrs) {
            found = true;
            if (/windowSoftInputMode/.test(attrs))
              return m.replace(/android:windowSoftInputMode="[^"]*"/, 'android:windowSoftInputMode="adjustNothing"');
            return '<activity android:windowSoftInputMode="adjustNothing"' + attrs + '>';
          });
          if (!found) { console.error('ERROR: MainActivity not found in AndroidManifest.xml'); process.exit(1); }
          fs.writeFileSync(p, s);
          if (!/adjustNothing/.test(fs.readFileSync(p, 'utf8'))) { console.error('ERROR: windowSoftInputMode not applied'); process.exit(1); }
          console.log('OK: windowSoftInputMode=adjustNothing');
          NODEEOF
          node patch-manifest.js
          grep -n 'windowSoftInputMode' android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: Cashbook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
